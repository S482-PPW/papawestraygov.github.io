<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>papawestray</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"PingFang SC",Arial;
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ===== NAV ===== */
.top-navbar{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    background:rgba(74,122,181,0.12);
    backdrop-filter:blur(20px);
    z-index:9999;
}

.nav-inner{
    max-width:1100px;
    margin:0 auto;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.nav-logo{
    position:absolute;
    left:0;
}

.nav-logo img{height:30px;}

/* ⭐ 导航文字加粗 + 高亮 */
.nav-menu{
    display:flex;
    gap:70px;
}

.nav-item{
    font-weight:600;
    color:#222;
    cursor:pointer;
    transition:0.2s;
}

.nav-item:hover{
    color:#000;
    transform:translateY(-1px);
}

/* ===== MEGA MENU ===== */
.mega-menu{
    position:fixed;
    top:60px;
    width:100%;
    background:#fff;
    box-shadow:0 30px 80px rgba(0,0,0,0.12);

    opacity:0;
    transform:translateY(-16px);
    pointer-events:none;

    transition:.35s cubic-bezier(.22,1,.36,1);
}

.mega-menu.active{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.mega-content{
    max-width:1100px;
    margin:0 auto;
    padding:40px 20px;
}

/* ⭐ 单列布局（逐行） */
.mega-column{
    text-align:left;
}

/* 标题 */
.mega-title{
    font-weight:600;
    margin-bottom:14px;
}

/* ⭐ 全黑交互 */
.mega-link{
    display:block;
    margin:10px 0;
    text-decoration:none;
    color:#111;
    transition:0.2s;
}

.mega-link:hover{
    color:#000;
    text-decoration:underline;
}

/* ===== MAIN ===== */
.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:120px;
}

.main-container{
    max-width:1000px;
    width:100%;
    text-align:center;
}

.centered-title{
    font-size:2.6rem;
}

.subtitle{
    font-size:1.1rem;
    margin:20px 0 40px;
}

.image-wrapper{
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.15);
}

.centered-image{
    width:100%;
    aspect-ratio:16/9;
}

/* ===== FOOTER ===== */
.footer{
    background:#f5f5f7;
    padding:30px 20px;
    font-size:12px;
    color:#6e6e73;
}

.footer-inner{
    max-width:1100px;
    margin:0 auto;
}

.footer-line{
    border-top:1px solid #d2d2d7;
    margin-bottom:15px;
}

.footer-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:8px;
}

/* ⭐ hover 才有下划线 */
.footer-links a{
    color:#6e6e73;
    text-decoration:none;
}

.footer-links a:hover{
    text-decoration:underline;
}

/* 广告 */
.footer-extra{
    margin-top:12px;
    line-height:1.6;
    color:#111;
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="top-navbar">
<div class="nav-inner">

<a href="https://papawestraygov.github.io/" class="nav-logo">
<img src="./logo.png">
</a>

<div class="nav-menu">
<div class="nav-item" data-menu="members">成员</div>
<div class="nav-item" data-menu="history">历史</div>
<div class="nav-item" data-menu="products">产品</div>
<div class="nav-item" data-menu="join">加入我们</div>
<div class="nav-item" data-menu="about">关于我们</div>
</div>

</div>
</nav>

<!-- MEGA -->
<div class="mega-menu" id="megaMenu">
<div class="mega-content" id="megaContent"></div>
</div>

<!-- MAIN -->
<div class="main">
<div class="main-container">

<h1 class="centered-title">papawestray</h1>
<p class="subtitle">帕帕韦斯特雷国</p>

<div class="image-wrapper">
<img class="centered-image" src="./001.jpg">
</div>

</div>
</div>

<!-- FOOTER -->
<div class="footer">
<div class="footer-inner">

<div class="footer-line"></div>

<div>
2026 Papawestraygovernment. All rights reserved. <br>
</div>

<div class="footer-links">
<a href="#">隐私政策</a> |
<a href="#">使用条款</a> |
<a href="#">销售政策</a> |
<a href="#">法律信息</a> |
<a href="#">网站地图</a>
</div>

<div style="margin-top:6px;">
嗯对嗯对嗯对嗯对嗯对嗯对嗯对嗯对嗯对嗯对<br>
</div>

<div class="footer-extra">
广告位招租<br>
Tao_Yanji@outlook.com
</div>

</div>
</div>

<script>
const data={
members:`<div class="mega-column">
<div class="mega-title">成员</div>
<a href="https://papawestraygov.github.io/members" class="mega-link">成员介绍</a>
<a href="https://papawestraygov.github.io/organization" class="mega-link">组织结构</a>
</div>`,

history:`<div class="mega-column">
<div class="mega-title">历史</div>
<a href="https://papawestraygov.github.io/history" class="mega-link">发展历程</a>
<a href="https://papawestraygov.github.io/events" class="mega-link">重要事件</a>
</div>`,

products:`<div class="mega-column">
<div class="mega-title">产品</div>
<a href="https://papawestraygov.github.io/projects" class="mega-link">项目展示</a>
<a href="https://papawestraygov.github.io/technologies" class="mega-link">技术成果</a>
</div>`,

join:`<div class="mega-column">
<div class="mega-title">加入我们</div>
<a href="https://papawestraygov.github.io/join" class="mega-link">招募计划</a>
<a href="https://papawestraygov.github.io/apply" class="mega-link">申请方式</a>
</div>`,

about:`<div class="mega-column">
<div class="mega-title">关于我们</div>
<a href="https://papawestraygov.github.io/about" class="mega-link">组织简介</a>
<a href="https://papawestraygov.github.io/contact" class="mega-link">联系方式</a>
</div>`
};

const menu=document.getElementById("megaMenu");
const content=document.getElementById("megaContent");

let timer;

document.querySelectorAll(".nav-item").forEach(item=>{
item.addEventListener("mouseenter",()=>{
clearTimeout(timer);
content.innerHTML=data[item.dataset.menu];
menu.classList.add("active");
});
});

menu.addEventListener("mouseleave",()=>{
timer=setTimeout(()=>menu.classList.remove("active"),200);
});
</script>

</body>
</html>
